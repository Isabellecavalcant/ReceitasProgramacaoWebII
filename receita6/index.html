<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receita 6 — Objetos e tabelas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Receita 6 — Objetos e tabelas</h1>
    <p>Os dados são objetos JavaScript. A mesma função monta tabelas para conjuntos diferentes.</p>

    <section aria-labelledby="tituloCervejas">
      <h2 id="tituloCervejas">Cervejas</h2>
      <button id="botaoCervejas" type="button">Mostrar cervejas</button>
      <div id="cervejasDiv" class="resultado" aria-live="polite"></div>
    </section>

    <section aria-labelledby="tituloSorvetes">
      <h2 id="tituloSorvetes">Outro exemplo: sorvetes</h2>
      <button id="botaoSorvetes" type="button">Mostrar sorvetes</button>
      <div id="sorvetesDiv" class="resultado" aria-live="polite"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
